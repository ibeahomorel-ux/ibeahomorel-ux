<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="8" viewBox="0 0 1200 8" role="presentation" aria-hidden="true">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <style>
      .dot{animation:move 6s ease-in-out infinite alternate}
      @keyframes move{from{transform:translateX(-380px)}to{transform:translateX(380px)}}
      @media (prefers-reduced-motion:reduce){.dot{animation:none}}
    </style>
  </defs>
  <rect x="0" y="3" width="1200" height="2" fill="url(#g)" opacity="0.8"/>
  <circle class="dot" cx="600" cy="4" r="3" fill="#22D3EE"/>
</svg>
