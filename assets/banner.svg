<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Ibeaho Morel Calleb — Full-Stack &amp; AI Automation Developer</title>
  <desc id="description">Présentation sur fond bleu-gris clair, avec un schéma de catalogue, de recherche et d'accès aux PDF inspiré du projet Congo Libs.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#CAD5E0" stroke-width="1" opacity=".42"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#285DD8"/>
      <stop offset="1" stop-color="#168B8B"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#F1F5F8"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="7" height="320" fill="url(#accent)"/>

  <text x="60" y="106" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="750" fill="#16263D">Ibeaho Morel Calleb</text>
  <text x="60" y="151" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23" font-weight="650" fill="#285DD8">Full-Stack &amp; AI Automation Developer</text>
  <text x="60" y="193" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#52667D">Applications web, API et automatisation de services.</text>
  <rect x="60" y="218" width="116" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="60" y="263" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" fill="#52667D">Des outils reliés à des usages concrets.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <path d="M821 157h39M981 157h39" stroke="#168B8B" stroke-width="2"/>
    <circle cx="840" cy="157" r="3" fill="#168B8B"/>
    <circle cx="1000" cy="157" r="3" fill="#168B8B"/>

    <rect x="700" y="124" width="120" height="66" rx="8" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2"/>
    <path d="M723 143h22v28h-22zM748 143h22v28h-22z" fill="none" stroke="#285DD8" stroke-width="2"/>
    <path d="M728 150h12M753 150h12M728 156h12M753 156h12" stroke="#52667D" stroke-width="1.5"/>
    <text x="760" y="214" text-anchor="middle" font-size="14" fill="#16263D">Catalogue</text>

    <rect x="860" y="124" width="120" height="66" rx="8" fill="#FFFFFF" stroke="#CAD5E0" stroke-width="2"/>
