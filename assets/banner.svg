<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">IBEAHO MOREL CALLEB — Full-Stack &amp; AI Automation Developer</title>
  <desc id="d">Bannière sombre avec le nom, le titre et un schéma API, workflow, IA.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="1" stop-color="#0E1A33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1B2740" stroke-width="1" opacity="0.55"/>
    </pattern>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .flow{stroke-dasharray:6 8;animation:dash 1.6s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-28}}
      .cursor{animation:blink 1.2s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .pulse{animation:pulse 3.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @media (prefers-reduced-motion:reduce){.flow,.cursor,.pulse{animation:none}}
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="320" fill="url(#accent)"/>

  <!-- Texte -->
  <text x="60" y="118" class="sans" font-size="44" font-weight="800" fill="#F1F5F9" letter-spacing="0.5">IBEAHO MOREL CALLEB</text>
  <text x="60" y="162" class="sans" font-size="24" font-weight="600" fill="#22D3EE">Full-Stack &amp; AI Automation Developer</text>
  <text x="60" y="202" class="sans" font-size="16" fill="#94A3B8">Applications web · API REST · Automatisation de workflows</text>
  <rect x="60" y="226" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="60" y="268" class="mono" font-size="15" fill="#64748B">$ python manage.py runserver<tspan class="cursor" fill="#22D3EE"> ▍</tspan></text>

  <!-- Schéma API → Workflow → IA -->
  <g class="mono" font-size="14" text-anchor="middle">
    <line class="flow" x1="820" y1="160" x2="860" y2="160" stroke="#38BDF8" stroke-width="2"/>
    <line class="flow" x1="980" y1="160" x2="1020" y2="160" stroke="#38BDF8" stroke-width="2"/>

    <rect x="700" y="130" width="120" height="60" rx="10" fill="#111827" stroke="#2563EB" stroke-width="2"/>
    <text x="760" y="166" fill="#E2E8F0">REST API</text>

    <rect x="860" y="130" width="120" height="60" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="2" class="pulse"/>
    <text x="920" y="166" fill="#E2E8F0">Workflow</text>

    <rect x="1020" y="130" width="120" height="60" rx="10" fill="#111827" stroke="#22D3EE" stroke-width="2"/>
    <text x="1080" y="166" fill="#E2E8F0">IA / LLM</text>
  </g>
  <text x="920" y="228" class="mono" font-size="13" text-anchor="middle" fill="#64748B">Django · n8n · Make · OpenAI API</text>
</svg>
